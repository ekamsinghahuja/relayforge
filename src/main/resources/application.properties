spring.application.name=relayforge

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/relayforge}
spring.datasource.username=${DATABASE_USERNAME:relayforge}
spring.datasource.password=${DATABASE_PASSWORD:relayforge_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

relayforge.delivery.poll-interval-ms=5000
relayforge.delivery.batch-size=25
relayforge.delivery.lease-duration-seconds=60
relayforge.delivery.enabled=true
relayforge.delivery.max-attempts=${RELAYFORGE_MAX_ATTEMPTS:5}
relayforge.encryption.key=${RELAYFORGE_ENCRYPTION_KEY:}
relayforge.cors.allowed-origin=${RELAYFORGE_CORS_ORIGIN:http://localhost:5173}
