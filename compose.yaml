
services:
  postgres:
    image: postgres:17
    container_name: relayforge-postgres
    environment:
      POSTGRES_DB: relayforge
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: relayforge_dev
    ports:
      - "5432:5432"
    volumes:
      - relayforge_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: relayforge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ekamsinghahuja123@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  relayforge_data:
  pgadmin_data:
